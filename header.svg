  <!-- Dark left panel overlay (text area) -->
  <polygon points="0,0 488,0 418,200 0,200" fill="#0A0A0A"/>

  <!-- Diagonal panel cut — double line -->
  <line x1="488" y1="0" x2="418" y2="200" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="497" y1="0" x2="427" y2="200" stroke="#FFFFFF" stroke-width="0.8" opacity="0.35"/>

  <!-- Outer border -->
  <rect x="1.5" y="1.5" width="897" height="197" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Inner border -->
  <rect x="8" y="8" width="884" height="184" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.28"/>

  <!-- Focal point marker (speed lines origin) -->
  <circle cx="780" cy="100" r="3.5" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="780" cy="100" r="9" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.22"/>
  <circle cx="780" cy="100" r="18" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.1"/>

  <!-- CARLOS — main title -->
  <text x="45" y="98"
        font-family="Impact,'Arial Narrow','Arial Black',sans-serif"
        font-size="70"
        fill="#FFFFFF"
        letter-spacing="6">CARLOS</text>

  <!-- Q.E. -->
  <text x="49" y="150"
        font-family="Impact,'Arial Narrow','Arial Black',sans-serif"
        font-size="42"
        fill="#FFFFFF"
        opacity="0.82"
        letter-spacing="14">Q.E.</text>

  <!-- Thin separator line -->
  <line x1="45" y1="162" x2="400" y2="162" stroke="#FFFFFF" stroke-width="0.5" opacity="0.28"/>

  <!-- Diamond accent -->
  <rect x="36.5" y="171.5" width="5" height="5" fill="#FFFFFF" opacity="0.55" transform="rotate(45,39,174)"/>

  <!-- Role descriptor -->
  <text x="48" y="180"
        font-family="'Courier New',Courier,monospace"
        font-size="10"
        fill="#686868"
        letter-spacing="2">SYS.ENG ·· DEVELOPER ·· CREATOR ·· BOLIVIA</text>

  <!-- VOL label (manga chapter style) -->
  <text x="862" y="20"
        font-family="'Courier New',Courier,monospace"
        font-size="9"
        fill="#FFFFFF"
        opacity="0.38"
        text-anchor="middle">VOL.01</text>

  <!-- GitHub handle -->
  <text x="887" y="187"
        font-family="'Courier New',Courier,monospace"
        font-size="9"
        fill="#FFFFFF"
        opacity="0.28"
        text-anchor="end">github.com/CarlosQE</text>
</svg>
